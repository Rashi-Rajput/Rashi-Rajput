<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="Rashi Rajput — Computer Vision, Machine Learning, Intelligent Systems" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#16233A"/>
      <stop offset="1" stop-color="#2E4468"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#F4C27A" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F4C27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4C27A"/>
      <stop offset="1" stop-color="#E8A4AC"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9CC8FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9CC8FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#9CC8FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .tw { animation: tw 3.6s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
      .fl { animation: fl 7s ease-in-out infinite; }
      @keyframes fl { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <rect width="1000" height="290" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="290" rx="18" fill="url(#glow)"/>

  <g fill="#E6EDF3">
    <circle class="tw" cx="70"  cy="48"  r="1.6" style="animation-delay:0s"/>
    <circle class="tw" cx="150" cy="210" r="1.2" style="animation-delay:.8s"/>
    <circle class="tw" cx="210" cy="86"  r="1.9" style="animation-delay:1.6s"/>
    <circle class="tw" cx="320" cy="250" r="1.3" style="animation-delay:2.4s"/>
    <circle class="tw" cx="380" cy="38"  r="1.5" style="animation-delay:.4s"/>
    <circle class="tw" cx="610" cy="30"  r="1.2" style="animation-delay:1.2s"/>
    <circle class="tw" cx="690" cy="255" r="1.8" style="animation-delay:2s"/>
    <circle class="tw" cx="760" cy="60"  r="1.3" style="animation-delay:2.8s"/>
    <circle class="tw" cx="930" cy="215" r="1.6" style="animation-delay:.6s"/>
    <circle class="tw" cx="960" cy="40"  r="1.2" style="animation-delay:1.8s"/>
    <circle class="tw" cx="45"  cy="150" r="1.4" style="animation-delay:3s"/>
    <circle class="tw" cx="540" cy="262" r="1.2" style="animation-delay:1s"/>
  </g>

  <g class="fl">
    <ellipse cx="868" cy="100" rx="64" ry="13" fill="none" stroke="#9CC8FF" stroke-opacity="0.55" stroke-width="2" transform="rotate(-18 868 100)"/>
    <circle cx="868" cy="100" r="34" fill="url(#planet)"/>
    <path d="M834 100 A34 34 0 0 0 902 100 A44 12 -18 0 1 834 100 Z" fill="#0D1117" fill-opacity="0.18"/>
  </g>

  <text x="500" y="82" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="6" fill="#A6B9D1">✦  WELCOME TO MY CORNER OF GITHUB  ✦</text>
  <text x="500" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="bold" fill="#E6EDF3">Rashi Rajput</text>
  <rect x="300" y="182" width="400" height="1.5" fill="url(#rule)"/>
  <text x="500" y="214" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="16" letter-spacing="3" fill="#9CC8FF">Computer Vision · Machine Learning · Intelligent Systems</text>
  <text x="500" y="244" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#A6B9D1">I build things that see, learn, and solve real problems.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
