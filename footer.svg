<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Made with curiosity and a lot of debugging" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E4468"/>
      <stop offset="0.5" stop-color="#16233A"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <style>
      .tw { animation: tw 3.6s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1000" height="110" rx="18" fill="url(#bg)"/>
  <g fill="#E6EDF3">
    <circle class="tw" cx="90"  cy="30" r="1.5" style="animation-delay:0s"/>
    <circle class="tw" cx="250" cy="80" r="1.2" style="animation-delay:1s"/>
    <circle class="tw" cx="420" cy="22" r="1.4" style="animation-delay:2s"/>
    <circle class="tw" cx="640" cy="88" r="1.3" style="animation-delay:.5s"/>
    <circle class="tw" cx="800" cy="28" r="1.6" style="animation-delay:1.5s"/>
    <circle class="tw" cx="930" cy="76" r="1.2" style="animation-delay:2.5s"/>
  </g>
  <text x="500" y="62" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="3" fill="#A6B9D1">made with curiosity &amp; a lot of debugging</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
